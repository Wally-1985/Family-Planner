services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finances
      POSTGRES_USER: finances
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finances"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build: ./app/frontend
    ports:
      - "5174:5174"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./app/backend
    ports:
      - "8088:8088"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      ENV_PATH: /data/.env.runtime
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
